apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kubedev-controller
  name: kubedev-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubedev-controller
  strategy: {}
  template:
    metadata:
      labels:
        app: kubedev-controller
    spec:
      serviceAccountName: kubedev-controller
      containers:
        - image: hugo08/kubedev-controller:0.0.2
          name: kubedev-controller
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources: {}
status: {}
