[package]
name = "kubedev-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.18.1"
clap = { version = "4.5.50", features = ["derive", "env"] }
futures = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "client", "derive"] }
opentelemetry = { version = "0.33.1", features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[[bin]]
name = "crdgen"
path = "src/crdgen.rs"
