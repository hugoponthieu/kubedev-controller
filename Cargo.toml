[package]
name = "kubedev-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "client", "derive"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "crdgen"
path = "src/crdgen.rs"
